<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carlos Jiménez Hirashi - Data Scientist</title>
    <meta name="description" content="Científico de Datos Jr. especializado en Machine Learning y automatización HVAC">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading" class="loading">
        <div class="spinner"></div>
    </div>

    <!-- Header -->
    <header class="header" id="header" style="display: none;">
        <nav class="nav container">
            <a href="#" class="logo">CJH</a>
            <ul class="nav-links">
                <li><a href="#about">Sobre mí</a></li>
                <li><a href="#tech">Tecnologías</a></li>
                <li><a href="#projects">Proyectos</a></li>
                <li><a href="#contact">Contacto</a></li>
            </ul>
            <div class="theme-toggle">
                <button class="theme-btn" data-theme="light" title="Tema claro">
                    <span data-icon="sun"></span>
                </button>
                <button class="theme-btn" data-theme="dark" title="Tema oscuro">
                    <span data-icon="moon"></span>
                </button>
                <button class="theme-btn" data-theme="system" title="Tema del sistema">
                    <span data-icon="monitor"></span>
                </button>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main id="main-content" style="display: none;">
        <!-- Hero Section -->
        <section class="hero">
            <div class="container">
                <h1 id="hero-name"></h1>
                <p class="hero-subtitle" id="hero-subtitle"></p>
                <div class="hero-badges" id="hero-badges"></div>
            </div>
        </section>

        <!-- About Section -->
        <section class="section" id="about">
            <div class="container">
                <h2 class="section-title">Sobre mí</h2>
                <div class="about-content">
                    <div class="about-text" id="about-text"></div>
                    <div class="about-stats" id="about-stats"></div>
                </div>
            </div>
        </section>

        <!-- Tech Stack Section -->
        <section class="section" id="tech">
            <div class="container">
                <h2 class="section-title">Tech Stack</h2>
                <div class="tech-grid" id="tech-grid"></div>
            </div>
        </section>

        <!-- Projects Section -->
        <section class="section" id="projects">
            <div class="container">
                <h2 class="section-title">Proyectos Destacados</h2>
                <div class="projects-grid" id="projects-grid"></div>
            </div>
        </section>

        <!-- Contact Section -->
        <section class="section" id="contact">
            <div class="container">
                <h2 class="section-title">Contacto</h2>
                <div class="contact-grid" id="contact-grid"></div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer" id="footer" style="display: none;">
        <div class="container">
            <p class="footer-text" id="footer-text"></p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="script.js"></script>
</body>
</html>
